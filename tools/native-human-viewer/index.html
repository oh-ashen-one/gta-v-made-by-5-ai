<!doctype html><meta charset="utf-8"><title>Orchard Reach — native human motion review</title>
<style>body{margin:0;background:#101716;color:#ebeee9;font:16px system-ui}header{padding:16px 24px;display:flex;gap:16px;align-items:center}button,select,input{font:inherit;background:#23352e;color:#eef3eb;border:1px solid #567265;border-radius:6px;padding:8px}label{font-size:13px}#stage{height:calc(100vh - 130px)}canvas{display:block}footer{padding:12px 24px;color:#9fc7b4;font-size:13px}</style>
<header><b>Josh · native Mixamo rig</b><label>Clip <select id="clip" aria-label="Animation clip"></select></label><button id="play">Pause</button><label>Cycle <input id="phase" aria-label="Cycle phase" type="number" min="0" max="1" step="0.01" value="0" style="width:72px"></label><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="rear">Rear</button><button id="save">Save snapshot</button></header><div id="stage"></div><footer id="status">Loading exported GLB…</footer>

<script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(0x202b28);stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.01,50);scene.add(new THREE.HemisphereLight(0xf7f5ef,0x526755,2.2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,6,-4);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x56665e,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);scene.add(new THREE.GridHelper(20,40,0x829a8a,0x697d70));
let mixer,clips,action,playing=true,view='front',last=0,selected='run';const phase=document.querySelector('#phase'),select=document.querySelector('#clip');
function setView(v){view=v;camera.position.set(...({front:[2.1,1.2,-3.5],side:[3.8,1.15,.05],rear:[-2.1,1.2,3.5]}[v]));camera.lookAt(0,.9,0)}setView(view);
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
new GLTFLoader().load('/player_native.glb',g=>{const model=g.scene;model.rotation.y=Math.PI;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});mixer=new THREE.AnimationMixer(model);clips=g.animations;for(const c of clips){const option=document.createElement('option');option.value=c.name;option.textContent=c.name;select.appendChild(option)}select.value='run';setClip('run');document.querySelector('#status').textContent=`Exported asset: ${clips.length} clips · ${model.getObjectByProperty('type','SkinnedMesh')?'skinned mesh':'NO SKIN'} · original weights and textures · no game or procedural deformation layers`;},undefined,e=>document.querySelector('#status').textContent='LOAD FAILED '+e.message);
function setClip(name){selected=name;mixer.stopAllAction();action=mixer.clipAction(THREE.AnimationClip.findByName(clips,name));action.reset().play();phase.value='0'}
select.onchange=()=>setClip(select.value);document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};
phase.oninput=()=>{if(!action)return;playing=false;document.querySelector('#play').textContent='Play';action.time=Number(phase.value)*action.getClip().duration;mixer.update(0)};
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>setView(b.dataset.view);

function frame(t){requestAnimationFrame(frame);if(t-last<1000/30)return;const dt=Math.min((t-last)/1000,.05);last=t;if(mixer&&playing){mixer.update(dt);phase.value=(action.time/action.getClip().duration).toFixed(2)}renderer.render(scene,camera)}requestAnimationFrame(frame);
</script>
